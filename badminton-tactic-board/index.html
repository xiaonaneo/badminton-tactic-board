<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0c8a4f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="羽毛球战术板" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <title>羽毛球战术板</title>
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="羽毛球战术板" />
  <meta property="og:title" content="羽毛球战术板" />
  <meta property="og:description" content="守住直线！" />
  <meta property="og:url" content="https://badminton-tactic-board.netlify.app/" />
  <meta property="og:image" content="https://badminton-tactic-board.netlify.app/og-image.png" />
  <meta property="og:image:width" content="1000" />
  <meta property="og:image:height" content="1000" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="羽毛球战术板" />
  <meta name="twitter:description" content="守住直线！" />
  <meta name="twitter:image" content="https://badminton-tactic-board.netlify.app/og-image.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="toolbar">
      <div class="seg" role="radiogroup" aria-label="工具">
        <label class="seg-item">
          <input type="radio" name="tool" value="select" checked />
          <span class="control-icon" data-tooltip="移动"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v20M2 12h20"/><path d="m12 2-3 3M12 2l3 3M12 22l-3-3M12 22l3-3M2 12l3-3M2 12l3 3M22 12l-3-3M22 12l-3 3"/><circle cx="12" cy="12" r="2"/></svg></span>
        </label>
        <label class="seg-item">
          <input type="radio" name="tool" value="arrow" />
          <span class="control-icon" data-tooltip="箭头"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 19 5"/><path d="M9 5h10v10"/></svg></span>
        </label>
        <label class="seg-item">
          <input type="radio" name="tool" value="brush" />
          <span class="control-icon" data-tooltip="画笔"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m4 20 4.5-1L19 8.5a2.1 2.1 0 0 0-3-3L5.5 16 4 20Z"/><path d="m14 7 3 3"/></svg></span>
        </label>
        <label class="seg-item">
          <input type="radio" name="tool" value="text" />
          <span class="control-icon" data-tooltip="标注"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v10H9l-4 4V5Z"/><path d="M8 9h8M8 12h5"/></svg></span>
        </label>
      </div>

      <div class="actions">
        <div class="action-group adds">
          <button class="chip" id="add-red" data-tooltip="红方" aria-label="添加红方"><span class="swatch red"></span></button>
          <button class="chip" id="add-blue" data-tooltip="蓝方" aria-label="添加蓝方"><span class="swatch blue"></span></button>
          <button class="chip" id="add-shuttle" data-tooltip="球" aria-label="添加羽毛球"><span class="swatch shuttle"></span></button>
        </div>
        <div class="action-group ops">
          <button class="ghost" id="undo" data-tooltip="撤回" aria-label="撤回"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7 4 12l5 5"/><path d="M4 12h10a6 6 0 0 1 6 6"/></svg></button>
          <button class="ghost" id="delete" data-tooltip="删除" aria-label="删除选中"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m4 16 9-9a2.1 2.1 0 0 1 3 0l2 2a2.1 2.1 0 0 1 0 3l-8 8H5l-2-2a2.1 2.1 0 0 1 1-2Z"/><path d="m9 20 8-8"/></svg></button>
          <button class="ghost" id="clear" data-tooltip="清空" aria-label="清空"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12l-1 14H7L6 7Z"/><path d="M9 7V4h6v3M4 7h16M10 11v6M14 11v6"/></svg></button>
        </div>
        <div class="action-group share">
          <button class="primary" id="save" data-tooltip="分享战术" aria-label="分享战术"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 18-8-8 18-2.5-7.5L3 11Z"/><path d="m10.5 13.5 5-5"/></svg></button>
        </div>
      </div>
      </div>
    </aside>

    <div class="board">
      <svg id="court" aria-label="羽毛球场地"></svg>
    </div>

    <div class="toast" id="toast" hidden></div>
  </div>

  <script src="court.js"></script>
  <script src="share-utils.js"></script>
  <script src="app.js"></script>
</body>
</html>
